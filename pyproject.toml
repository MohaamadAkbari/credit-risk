[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "credit-risk"
version = "0.1.0"
description = "Credit default risk decision system: calibrated PD model, profit-based approve / review / decline policy, reason codes and fairness audit."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Mohammad Akbari" }]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "scikit-learn>=1.5",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.5",
    "jupyter",
    "nbconvert>=7",
    "ipykernel",
    "kaggle",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["notebooks", "working-notes"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]   # long rule strings in the availability table are intentional
